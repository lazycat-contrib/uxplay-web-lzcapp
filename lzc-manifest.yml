name: UxPlay Web
package: community.lazycat.app.uxplay-web
version: 1.0.0
min_os_version: 1.3.8
description: "AirPlay mirroring server with web interface for streaming from iOS/macOS devices"
license: MIT
homepage: https://github.com/johannvr/uxplay-web
author: johannvr

application:
  subdomain: uxplay-web
  background_task: true
  upstreams:
    - location: /
      backend: http://host.lzcapp:11111/

services:
  uxplay-web-service:
    # johannvr/uxplay-web:1.0.0
    image: registry.lazycat.cloud/czyt/johannvr/uxplay-web:6fe15755383a2ee2
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ={{.U.timezone}}
      - CUSTOM_PORT=11111
      - CUSTOM_HTTPS_PORT=11112
      - AIRPLAY_NAME={{.U.airplay_name}}

locales:
  en:
    name: "UxPlay Web"
    description: "AirPlay mirroring server with web interface for streaming from iOS/macOS devices"
  zh:
    name: "UxPlay Web"
    description: "支持 iOS/macOS 设备投屏的 AirPlay 镜像服务器"
